<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { font: 12px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 14px; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #111); }
  h1 { font-size: 13px; margin: 0 0 8px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary, #f5f5f5); margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #b91c1c; flex: none; }
  .dot.ok { background: #15803d; } .dot.wait { background: #b45309; }
  label { display: block; margin: 8px 0 3px; color: var(--figma-color-text-secondary, #555); }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--figma-color-border, #ddd); border-radius: 4px; background: transparent; color: inherit; }
  button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: var(--figma-color-bg-brand, #0d6efd); color: #fff; font-weight: 600; cursor: pointer; }
  .log { margin-top: 10px; height: 54px; overflow: auto; color: var(--figma-color-text-secondary, #555); font-family: ui-monospace, monospace; font-size: 10.5px; }
</style>
</head>
<body>
  <h1>ui-ux-magec bridge</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="state">Not connected</span></div>
  <button id="connect">Reconnect</button>
  <div id="log" class="log"></div>
<script>
  const PROTOCOL = 1;
  let ws = null, settings = null, retry = 0, retryTimer = null, manualClose = false;
  const $ = (id) => document.getElementById(id);
  function log(text) { const l = $('log'); l.textContent = `${new Date().toLocaleTimeString()} ${text}\n` + l.textContent.slice(0, 2000); }
  function setState(text, cls) { $('state').textContent = text; $('dot').className = 'dot ' + (cls || ''); }
  function post(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }

  function connect() {
    if (!settings) return;
    clearTimeout(retryTimer);
    if (ws) { manualClose = true; ws.close(); }
    manualClose = false;
    setState('Connecting…', 'wait');
    const socket = new WebSocket(`ws://localhost:${settings.port}`);
    ws = socket;
    socket.onopen = () => socket.send(JSON.stringify({ type: 'hello', role: 'plugin', token: settings.token, protocol: PROTOCOL, plugin: settings.plugin }));
    socket.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'welcome') {
        if (msg.ok) { retry = 0; setState(`Connected · ${settings.plugin.fileName}`, 'ok'); log('connected to runtime'); post({ type: 'notify', message: 'ui-ux-magec connected' }); }
        else { setState('Rejected — rebuild the plugin (npm run build) and reopen it', ''); log(msg.error || 'unauthorized'); manualClose = true; }
        return;
      }
      if (msg.type === 'request') { log(`→ ${msg.operation && msg.operation.op}`); post({ type: 'request', id: msg.id, operation: msg.operation }); }
    };
    socket.onclose = () => {
      if (ws !== socket) return;
      setState('Waiting for ui-ux-magec…', 'wait');
      if (manualClose) return;
      retry = Math.min(retry + 1, 3); // retries forever, at most every 4 s
      retryTimer = setTimeout(connect, 500 * 2 ** retry);
    };
    socket.onerror = () => {};
  }

  window.onmessage = (ev) => {
    const msg = ev.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'settings') {
      settings = msg; connect();
    } else if (msg.type === 'response') {
      log(`← ${msg.ok ? 'ok' : 'error: ' + msg.error.message} (${msg.durationMs}ms)`);
      if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
    }
  };
  $('connect').onclick = () => { retry = 0; connect(); };
  post({ type: 'get-settings' });
</script>
</body>
</html>
